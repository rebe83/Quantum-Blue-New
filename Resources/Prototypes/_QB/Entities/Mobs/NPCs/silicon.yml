- type: entity
  parent: MobSiliconBase
  id: MobJunkBot
  name: junkbot
  description: A wobbly machine for putting garbage into. Don't let it lick your hand.
  components:
  - type: Sprite
    sprite: _QB/Mobs/Silicon/Bots/junkbot.rsi
    state: junkbot
  - type: GhostRole
    makeSentient: true
    name: ghost-role-information-supplybot-name
    description: ghost-role-information-supplybot-description
    rules: ghost-role-information-familiar-rules
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: Access
    tags:
    - Maintenance
  - type: Dumpable
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,7,3
    whitelist:
      components:
      - PhysicalComposition
      - MobState
      - SpaceGarbage
      - Material
      tags:
      - Trash
      - Recyclable
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UnpoweredFlashlight
  - type: PointLight
    enabled: false
    radius: 3.5
    softness: 2
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
  - type: ActiveRadio
    channels:
    - Binary
  - type: Puller
    needsHands: false
  - type: CollideMaterialReclaimer
  - type: MaterialReclaimer
    enabled: true
    scaleProcessSpeed: false #instant!
    minimumProcessDuration: 0
    whitelist:
      components:
      - PhysicalComposition
      - MobState
      - SpaceGarbage
      tags:
      - Trash
      - Recyclable
    blacklist:
      components:
      - Material
      - Pda
      - IdCard
      tags:
      - HighRiskItem
    sound:
      path: /Audio/Effects/saw.ogg
      params:
        volume: -3
    cutOffSound: true
  - type: InteractionPopup
    successChance: 1.0
    interactSuccessString: petting-success-recycler
    interactFailureString: petting-failure-generic
    interactSuccessSound:
      path: /Audio/Items/drill_hit.ogg
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepBorg
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
    - SiliconEmotes
    - Bot
    - Unimplantable
